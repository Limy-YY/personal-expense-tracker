{% extends "base.html" %}
{% block title %}{{ '修改记录' if mode == 'edit' else '记一笔' }}{% endblock %}

{% block content %}
<section class="overview overview-slim">
  <div class="overview-top">
    <h1 class="page-title">{{ '修改记录' if mode == 'edit' else '记一笔' }}</h1>
    <a class="link-quiet" href="{{ url_for('record_list') }}">返回明细</a>
  </div>
</section>

<section class="panel form-panel form-panel-wide">
  <form class="entry-form" method="post" novalidate data-entry-form
        action="{{ url_for('record_edit', record_id=record.id) if mode == 'edit' else url_for('record_add') }}">
    <div class="seg" role="radiogroup" aria-label="收支类型">
      <input type="radio" name="type" id="type-expense" value="expense"
             {{ 'checked' if (record.type if record else 'expense') == 'expense' else '' }}>
      <label for="type-expense">支出</label>
      <input type="radio" name="type" id="type-income" value="income"
             {{ 'checked' if (record.type if record else '') == 'income' else '' }}>
      <label for="type-income">收入</label>
    </div>

    <div class="field field-amount">
      <label for="amount">金额</label>
      <div class="amount-wrap">
        <span class="currency" aria-hidden="true">¥</span>
        <input id="amount" name="amount" type="text" inputmode="decimal" autocomplete="off"
               placeholder="0.00" value="{{ '%.2f' | format(record.amount) if record else '' }}" data-rule="amount">
      </div>
      <p class="err" data-err-for="amount" {{ 'hidden' if not errors.amount else '' }}>{{ errors.amount }}</p>
    </div>

    <div class="field-row field-row-3">
      <div class="field">
        <label for="date">日期</label>
        <input id="date" name="date" type="date" value="{{ record.date if record else today }}" data-rule="date">
        <p class="err" data-err-for="date" {{ 'hidden' if not errors.date else '' }}>{{ errors.date }}</p>
      </div>
      <div class="field">
        <label for="category">类别</label>
        <select id="category" name="category" data-rule="category" data-category-select>
          {% for c in categories %}
            <option value="{{ c.name }}" data-type="{{ c.type }}"
                    {{ 'selected' if record and record.category == c.name else '' }}>{{ c.name }}</option>
          {% endfor %}
        </select>
        <p class="err" data-err-for="category" {{ 'hidden' if not errors.category else '' }}>{{ errors.category }}</p>
      </div>
      <div class="field">
        <label for="account">账户</label>
        <select id="account" name="account">
          {% for a in accounts %}
            <option value="{{ a }}" {{ 'selected' if record and record.account == a else '' }}>{{ a }}</option>
          {% endfor %}
        </select>
      </div>
    </div>

    <div class="field">
      <label for="note">备注<span class="optional">可不填</span></label>
      <input id="note" name="note" type="text" maxlength="40" placeholder="例如：食堂二楼午饭"
             value="{{ record.note if record else '' }}">
    </div>

    <div class="form-actions">
      <button class="btn btn-primary" type="submit">{{ '保存修改' if mode == 'edit' else '记上这笔' }}</button>
      <a class="btn btn-ghost" href="{{ url_for('record_list') }}">取消</a>
    </div>
  </form>
</section>
{% endblock %}
