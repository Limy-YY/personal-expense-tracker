<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新增记账</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f5f7fa; margin: 0; padding: 20px; }
        .form-container { max-width: 500px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .form-container h2 { margin-top: 0; color: #333; text-align: center; border-bottom: 1px solid #eee; padding-bottom: 15px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 500; color: #555; }
        .form-group input[type="date"], .form-group input[type="number"], .form-group input[type="text"], .form-group select { 
            width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 14px; transition: border-color 0.3s;
        }
        .form-group input:focus, .form-group select:focus { border-color: #4CAF50; outline: none; }
        .radio-group { display: flex; gap: 20px; }
        .radio-group label { font-weight: normal; cursor: pointer; display: flex; align-items: center; gap: 5px; }
        .btn-submit { width: 100%; background: #4CAF50; color: white; padding: 12px; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; font-weight: bold; transition: background 0.3s; }
        .btn-submit:hover { background: #45a049; }
        .flash-messages { list-style: none; padding: 0; margin-bottom: 20px; }
        .flash-messages li { padding: 12px; border-radius: 6px; margin-bottom: 10px; font-size: 14px; }
        .flash-messages .success { background-color: #e8f5e9; color: #2e7d32; border: 1px solid #c8e6c9; }
        .flash-messages .error { background-color: #ffebee; color: #c62828; border: 1px solid #ffcdd2; }
    </style>
</head>
<body>

<div class="form-container">
    <div style="display:flex; justify-content:space-between; align-items:center;">
        <h2 style="margin:0;">新增记账</h2>
        <a href="/records" style="font-size:14px; color:#2563eb; text-decoration:none;">&larr; 返回明细</a>
    </div>

    <!-- Flash 提示信息 -->
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            <ul class="flash-messages">
            {% for category, message in messages %}
                <li class="{{ category }}">{{ message }}</li>
            {% endfor %}
            </ul>
        {% endif %}
    {% endwith %}

    <form action="{{ url_for('record_add.add') }}" method="POST">
        
        <!-- 收支类型 -->
        <div class="form-group">
            <label>收支类型 <span style="color:red;">*</span></label>
            <div class="radio-group">
                <label><input type="radio" name="type" value="expense" checked onchange="updateCategories()"> 支出</label>
                <label><input type="radio" name="type" value="income" onchange="updateCategories()"> 收入</label>
            </div>
        </div>

        <!-- 日期 -->
        <div class="form-group">
            <label for="date">日期 <span style="color:red;">*</span></label>
            <input type="date" id="date" name="date" required>
        </div>

        <!-- 金额 -->
        <div class="form-group">
            <label for="amount">金额 <span style="color:red;">*</span></label>
            <input type="number" id="amount" name="amount" step="0.01" min="0.01" placeholder="请输入金额" required>
        </div>

        <!-- 类别 (对接成员F) -->
        <div class="form-group">
            <label for="category">类别 <span style="color:red;">*</span></label>
            <select id="category" name="category" required>
                <!-- JS 动态注入 -->
            </select>
        </div>

        <!-- 账户 (对接成员B) -->
        <div class="form-group">
            <label for="account">账户 <span style="color:red;">*</span></label>
            <select id="account" name="account" required>
                <option value="">-- 请选择账户 --</option>
                <option value="微信">微信</option>
                <option value="支付宝">支付宝</option>
                <option value="银行卡">银行卡</option>
                <option value="现金">现金</option>
            </select>
        </div>

        <!-- 备注 -->
        <div class="form-group">
            <label for="note">备注</label>
            <input type="text" id="note" name="note" placeholder="选填，如：午饭">
        </div>

        <button type="submit" class="btn-submit">保存记录</button>
    </form>
</div>

<script>
    // 使用 JSON.parse 套一层字符串，完美解决 VS Code 语法检查报红线的问题
    const allCategories = JSON.parse('{{ categories_json | safe }}');

    document.addEventListener("DOMContentLoaded", function() {
        // 设置默认日期为今天
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('date').value = today;
        // 初始化下拉框
        updateCategories();
    });

    function updateCategories() {
        const selectedType = document.querySelector('input[name="type"]:checked').value;
        const categorySelect = document.getElementById('category');
        
        categorySelect.innerHTML = '<option value="">-- 请选择类别 --</option>';
        
        allCategories.forEach(cat => {
            if (cat.type === selectedType) {
                const option = document.createElement('option');
                // 提交给后端的只有 name
                option.value = cat.name;
                // 展示给前端的包含 icon 图标（对接成员F）
                option.textContent = cat.icon ? `${cat.icon} ${cat.name}` : cat.name;
                categorySelect.appendChild(option);
            }
        });
    }
</script>

</body>
</html>
