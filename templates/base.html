<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}账簿{% endblock %} · 个人收支记账</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%2316211B'/><path d='M9 8h14M9 16h14M9 24h9' stroke='%23F6F7F4' stroke-width='2.4'/></svg>">
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-in">
      <a class="brand" href="{{ url_for('index') }}">
        <span class="stamp">账</span>
        <span class="brand-text"><strong>账簿</strong><em>个人收支记账</em></span>
      </a>
      <nav class="nav" aria-label="主导航">
        <a href="{{ url_for('index') }}" class="{{ 'is-on' if active == 'index' else '' }}">记账</a>
        <a href="{{ url_for('record_list') }}" class="{{ 'is-on' if active == 'list' else '' }}">明细</a>
        <a href="{{ url_for('stats') }}" class="{{ 'is-on' if active == 'stats' else '' }}">统计</a>
        <a href="{{ url_for('categories') }}" class="{{ 'is-on' if active == 'categories' else '' }}">分类</a>
      </nav>
    </div>
  </header>

  <main class="wrap main">
    {% block content %}{% endblock %}
  </main>

  {% with msgs = get_flashed_messages(with_categories=true) %}
    {% if msgs %}
      <div id="flash-data" hidden>{{ msgs | tojson }}</div>
    {% endif %}
  {% endwith %}
  <div class="toast-stack" id="toastStack" role="status" aria-live="polite"></div>

  <script src="{{ url_for('static', filename='js/ui.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
