<section class="charts-grid">
  <article class="card">
    <div class="card-head">
      <h2>收支占比</h2>
    </div>
    <div class="chart-box">
      <canvas id="chart-overview"></canvas>
    </div>
  </article>

  <article class="card">
    <div class="card-head">
      <h2>分类统计</h2>
    </div>
    <div class="chart-box">
      <canvas id="chart-category"></canvas>
    </div>
  </article>

  <article class="card chart-wide">
    <div class="card-head">
      <h2>月度收支趋势</h2>
    </div>
    <div class="chart-box chart-box-tall">
      <canvas id="chart-trend"></canvas>
    </div>
  </article>
</section>

<script src="{{ url_for('static', filename='js/vendor/chart.umd.min.js') }}"></script>
<script src="{{ url_for('static', filename='js/charts.js') }}"></script>
<script>
(function () {
  var chartStats = {{ (chart_stats if chart_stats is defined else none) | tojson }};
  var chartData = {{ (chart_data if chart_data is defined else none) | tojson }};
  var chartCategories = {{ (chart_categories if chart_categories is defined else none) | tojson }};
  var chartType = {{ (chart_category_type if chart_category_type is defined else none) | tojson }};

  if (chartStats) {
    LedgerCharts.setStats(chartStats, chartCategories || undefined);
  } else {
    LedgerCharts.setData(chartData || { records: [], categories: [] });
  }

  LedgerCharts.renderAll(chartType ? { categoryType: chartType } : {});
})();
</script>
